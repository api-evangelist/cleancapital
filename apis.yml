aid: cleancapital
name: CleanCapital
description: 'CleanCapital is a New York based clean energy investment firm, founded
  in 2015, that develops, constructs, acquires, owns and operates distributed-generation
  solar and energy storage projects across the United States. It concentrates on the
  commercial and municipal middle market between residential rooftop and utility-scale
  generation, selling power to businesses, schools, nonprofits, municipalities and
  community solar subscribers, and it buys operating and late-stage development
  projects from developers through a dedicated project-acquisition practice. The firm
  reports more than $1.5 billion of capital deployed, 450+ MW under management, 235
  MW developed and constructed, 200+ energy customers and over 1,000 GWh of
  emissions-free generation, backed by institutional partners including Manulife
  Investment Management / John Hancock, BlackRock and CarVal Investors. CleanCapital
  is an asset owner and investment manager rather than a software vendor: it publishes
  no developer portal, no API documentation and no machine-readable API contract, and
  its customer portal at app.cleancapital.com now redirects to the third-party Dock
  Energy platform.'
